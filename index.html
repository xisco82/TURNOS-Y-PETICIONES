    <script>
      // Suppress harmless Vite HMR WebSocket closed errors in preview iframe
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
