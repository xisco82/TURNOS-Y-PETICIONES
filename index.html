    <script>
      // Cleanly intercept and neutralize Vite HMR WebSocket in Cloud Run preview iframe
      (function() {
        // 1. Intercept Vite HMR WebSocket creation so it never closes with error
        if (typeof window !== 'undefined' && window.WebSocket) {
          const RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('vite') || url.includes('/@vite')));

            if (isViteHmr) {
              const dummyWs = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: String(url),
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
                addEventListener: function(type, listener) {
                  if (type === 'open' && typeof listener === 'function') {
                    setTimeout(() => listener({ type: 'open' }), 50);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {},
              };
              setTimeout(() => {
                if (typeof dummyWs.onopen === 'function') {
                  dummyWs.onopen({ type: 'open' });
                }
              }, 50);
              return dummyWs;
            }

            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Intercept console.error and error events for any residual logs
        const origError = console.error;
        console.error = function(...args) {
          const str = args.map(a => (a && (a.message || a.stack)) || String(a || '')).join(' ');
          if (str.includes('WebSocket') || str.includes('ws://') || str.includes('wss://') || str.includes('[vite]')) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          const msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://') || msg.includes('[vite]')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const msg = String(e && (e.reason?.message || e.reason || ''));
          if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://') || msg.includes('[vite]')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
