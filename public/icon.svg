<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Hotel Star Cluster -->
  <g fill="url(#goldGrad)" transform="translate(196, 75) scale(0.6)">
    <polygon points="100,10 120,70 185,70 132,108 152,168 100,130 48,168 68,108 15,70 80,70"/>
  </g>

  <!-- Central Crest: Hotel HM Gran Fiesta Calendar & Clock Emblem -->
  <g filter="url(#glow)">
    <!-- Calendar Body -->
    <rect x="116" y="150" width="280" height="260" rx="36" fill="#1e1b4b" stroke="url(#indigoGrad)" stroke-width="8"/>
    
    <!-- Calendar Top Bar -->
    <path d="M 116 186 C 116 166.1 132.1 150 152 150 L 360 150 C 379.9 150 396 166.1 396 186 L 396 216 L 116 216 Z" fill="url(#indigoGrad)"/>
    
    <!-- Calendar Rings -->
    <rect x="176" y="130" width="20" height="42" rx="10" fill="#f8fafc"/>
    <rect x="316" y="130" width="20" height="42" rx="10" fill="#f8fafc"/>

    <!-- HM Monogram & Hotel Shield -->
    <text x="256" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">HM</text>
    
    <text x="256" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#cbd5e1" text-anchor="middle" letter-spacing="6">GRAN FIESTA</text>
    <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="3">TURNOS Y PETICIONES</text>
  </g>
</svg>
