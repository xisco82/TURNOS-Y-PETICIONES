<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="76" y="96" width="360" height="320" rx="36" fill="#1e293b" stroke="#334155" stroke-width="8"/>
  <!-- Calendar header bar -->
  <path d="M76 132 C76 112 92 96 112 96 L400 96 C420 96 436 112 436 132 L436 168 L76 168 Z" fill="url(#accent)"/>
  <!-- Ring binders -->
  <rect x="140" y="70" width="24" height="52" rx="12" fill="#f8fafc"/>
  <rect x="244" y="70" width="24" height="52" rx="12" fill="#f8fafc"/>
  <rect x="348" y="70" width="24" height="52" rx="12" fill="#f8fafc"/>
  <!-- Clock / shift graphic in center -->
  <circle cx="256" cy="280" r="90" fill="#0f172a" stroke="url(#accent)" stroke-width="14"/>
  <!-- Clock hands showing shift 9 to 5 -->
  <line x1="256" y1="280" x2="256" y2="225" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="280" x2="310" y2="295" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="280" r="14" fill="#6366f1"/>
  <!-- Shift pills bottom -->
  <rect x="120" y="380" width="80" height="18" rx="9" fill="#10b981"/>
  <rect x="216" y="380" width="80" height="18" rx="9" fill="#38bdf8"/>
  <rect x="312" y="380" width="80" height="18" rx="9" fill="#6366f1"/>
</svg>
